version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/jobs-api
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
      - run:
          name: Run tests
          command: python -m pytest -q

workflows:
  test_workflow:
    jobs:
      - test
